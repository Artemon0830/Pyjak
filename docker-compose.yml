services:
 
  app:
    build: 
      context: .
    depends_on:
    - minio
    ports:
      - "8888:3000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: on-failure
    command: npm run start:dev

  
  db:
    image: mongo
    ports:
      - "5558:27017"
    env_file:
      - .env
    volumes: 
      - ./mongo_db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: on-failure
  
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./client:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: on-failure
    
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: artem0830
      MINIO_ROOT_PASSWORD: artem123qaz
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 artem0830 artem123qaz;
      mc mb local/avatars;
      mc anonymous set public local/avatars;
      mc mb local/photos;
      mc anonymous set public local/photos;
      exit 0;
      "

volumes:
  minio_data: